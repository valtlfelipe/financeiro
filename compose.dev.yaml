name: financeiro-dev

services:
  db:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-financeiro}
      POSTGRES_USER: ${DB_USERNAME:-financeiro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-financeiro}
    volumes:
      - financeiro_dev_postgres_data:/var/lib/postgresql/data
      - ./docker/dev-initdb-testing.sql:/docker-entrypoint-initdb.d/10-testing-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [redis]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - financeiro_dev_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  financeiro_dev_postgres_data:
  financeiro_dev_redis_data:
