name: financeiro-dev

services:
  db:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DEV_DB_DATABASE:-financeiro}
      POSTGRES_USER: ${DEV_DB_USERNAME:-financeiro}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-financeiro}
    volumes:
      - financeiro_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - financeiro_dev_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  financeiro_dev_postgres_data:
  financeiro_dev_redis_data:
