name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: financeiro_testing
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeiro -d financeiro_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: financeiro_testing
      DB_USERNAME: financeiro
      DB_PASSWORD: financeiro
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_pgsql
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm install --ignore-scripts
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan wayfinder:generate --with-form --no-interaction
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: npm run ci
      - run: php artisan test --compact

